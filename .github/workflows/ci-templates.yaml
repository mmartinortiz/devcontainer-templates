name: "CI - Templates"
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      smoke_test_templates: ${{ steps.detect.outputs.smoke_test_templates }}
      changed_templates: ${{ steps.detect.outputs.changed_templates }}
      has_smoke_test_changes: ${{ steps.detect.outputs.has_smoke_test_changes }}
      has_changed_templates: ${{ steps.detect.outputs.has_changed_templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/detect-templates
        id: detect

  lint-actions:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          rm /tmp/actionlint.tar.gz
          chmod +x /usr/local/bin/actionlint

      - name: Run actionlint
        run: actionlint -color

      - name: Run shellcheck on composite action scripts
        run: shellcheck .github/actions/*/*.sh .github/scripts/validate-template.sh

  validate:
    needs: [detect]
    if: needs.detect.outputs.has_changed_templates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.detect.outputs.changed_templates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate '${{ matrix.template }}'
        run: .github/scripts/validate-template.sh "${{ matrix.template }}" "${{ github.event.pull_request.base.sha }}"

  smoke-test:
    needs: [detect, validate]
    if: |
      always() &&
      needs.detect.outputs.has_smoke_test_changes == 'true' &&
      needs.detect.result != 'failure' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.detect.outputs.smoke_test_templates) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test for '${{ matrix.template }}'
        uses: ./.github/actions/smoke-test
        with:
          template: "${{ matrix.template }}"

  ci-templates-ok:
    needs: [detect, validate, smoke-test, lint-actions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status of dependent jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs passed (or were correctly skipped)."
