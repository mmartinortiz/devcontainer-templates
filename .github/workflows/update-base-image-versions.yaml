name: "Bump Base Image Dependencies"

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: bump-base-image-deps
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest dependency versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api() {
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"
          }

          UV_VERSION="$(api https://api.github.com/repos/astral-sh/uv/releases/latest | jq -r '.tag_name')"
          STARSHIP_VERSION="$(api https://api.github.com/repos/starship/starship/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          PREK_VERSION="$(api https://api.github.com/repos/j178/prek/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          OPENCODE_VERSION="$(api https://api.github.com/repos/anomalyco/opencode/releases/latest | jq -r '.tag_name' | sed 's/^v//')"
          DELTA_VERSION="$(api https://api.github.com/repos/dandavison/delta/releases/latest | jq -r '.tag_name')"

          for name in UV_VERSION STARSHIP_VERSION PREK_VERSION OPENCODE_VERSION DELTA_VERSION; do
            value="${!name}"
            if [ -z "${value}" ] || [ "${value}" = "null" ]; then
              echo "Failed to resolve ${name}" >&2
              exit 1
            fi
          done

          echo "uv=${UV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "starship=${STARSHIP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "prek=${PREK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "opencode=${OPENCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "delta=${DELTA_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile and README defaults
        run: |
          set -euo pipefail

          sed -i \
            -e "s/^ARG UV_IMAGE_TAG=.*/ARG UV_IMAGE_TAG=${{ steps.versions.outputs.uv }}/" \
            -e "s/^ARG STARSHIP_VERSION=.*/ARG STARSHIP_VERSION=${{ steps.versions.outputs.starship }}/" \
            -e "s/^ARG PREK_VERSION=.*/ARG PREK_VERSION=${{ steps.versions.outputs.prek }}/" \
            -e "s/^ARG OPENCODE_VERSION=.*/ARG OPENCODE_VERSION=${{ steps.versions.outputs.opencode }}/" \
            -e "s/^ARG DELTA_VERSION=.*/ARG DELTA_VERSION=${{ steps.versions.outputs.delta }}/" \
            images/base/Dockerfile

          sed -i \
            -e "s/| \`UV_IMAGE_TAG\`[^|]*|[^|]*|/| \`UV_IMAGE_TAG\`    | \`${{ steps.versions.outputs.uv }}\` |/" \
            -e "s/| \`STARSHIP_VERSION\`[^|]*|[^|]*|/| \`STARSHIP_VERSION\`| \`${{ steps.versions.outputs.starship }}\` |/" \
            -e "s/| \`PREK_VERSION\`[^|]*|[^|]*|/| \`PREK_VERSION\`    | \`${{ steps.versions.outputs.prek }}\`  |/" \
            -e "s/| \`OPENCODE_VERSION\`[^|]*|[^|]*|/| \`OPENCODE_VERSION\`| \`${{ steps.versions.outputs.opencode }}\` |/" \
            -e "s/| \`DELTA_VERSION\`[^|]*|[^|]*|/| \`DELTA_VERSION\`   | \`${{ steps.versions.outputs.delta }}\` |/" \
            images/base/README.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.diff.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image with bumped versions
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64
          load: true
          push: false
          tags: devcontainer-base-bump-test

      - name: Run smoke tests
        if: steps.diff.outputs.changed == 'true'
        run: test/images/base/test.sh devcontainer-base-bump-test

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(images): bump base image dependencies to latest"
          title: "chore(images): bump base image dependencies to latest"
          body: |
            Automated weekly dependency bump for `images/base`.

            | Dependency | Version |
            | ---------- | ------- |
            | `uv`       | `${{ steps.versions.outputs.uv }}` |
            | `starship` | `${{ steps.versions.outputs.starship }}` |
            | `prek`     | `${{ steps.versions.outputs.prek }}` |
            | `opencode` | `${{ steps.versions.outputs.opencode }}` |
            | `delta`    | `${{ steps.versions.outputs.delta }}` |

            The bumped image was built and passed `test/images/base/test.sh` before this PR was opened.
          branch: chore/bump-base-image-deps
          delete-branch: true
