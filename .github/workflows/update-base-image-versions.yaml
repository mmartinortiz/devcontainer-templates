name: "Bump Base Image Dependencies"

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: bump-base-image-deps
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest dependency versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Age gate: only adopt releases published at least this many days ago,
          # so brand-new (possibly yanked/broken) upstream releases aren't picked up.
          MIN_AGE_DAYS=7
          CUTOFF="$(date -u -d "${MIN_AGE_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)"

          api() {
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$1"
          }

          # Newest non-draft, non-prerelease GitHub release published on/before CUTOFF.
          # The API returns releases newest-first, so .[0] is the newest eligible one.
          # ISO-8601 UTC timestamps compare correctly as plain strings.
          latest_gh_tag() {
            api "https://api.github.com/repos/$1/releases?per_page=30" \
              | jq -r --arg c "${CUTOFF}" \
                '[.[] | select(.draft == false and .prerelease == false and .published_at <= $c)] | .[0].tag_name // empty'
          }

          UV_VERSION="$(latest_gh_tag astral-sh/uv)"
          STARSHIP_VERSION="$(latest_gh_tag starship/starship | sed 's/^v//')"
          PREK_VERSION="$(latest_gh_tag j178/prek | sed 's/^v//')"
          # opencode V2 is published as Git tags only — the GitHub `/releases/latest`
          # endpoint keeps returning the newest V1 release object. Resolve the newest
          # npm version old enough instead: the registry packument's `time` map holds
          # per-version publish timestamps.
          OPENCODE_DOC="$(curl -fsSL https://registry.npmjs.org/@opencode/cli-linux-x64)"
          OPENCODE_VERSION="$(echo "${OPENCODE_DOC}" | jq -r --arg c "${CUTOFF}" '
            [.time | to_entries[]
              | select(.key | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | select(.value <= $c) | .key]
            | sort_by(split(".") | map(tonumber)) | .[-1] // empty')"
          # Both arch packages must publish the same version; verify arm64 also has it
          # and that it is old enough there too (publishes may not be simultaneous).
          OPENCODE_ARM64_TIME="$(curl -fsSL https://registry.npmjs.org/@opencode/cli-linux-arm64 | jq -r --arg v "${OPENCODE_VERSION}" '.time[$v] // empty')"
          if [ -z "${OPENCODE_ARM64_TIME}" ] || [ "${OPENCODE_ARM64_TIME}" \> "${CUTOFF}" ]; then
            echo "opencode ${OPENCODE_VERSION} missing or too new on cli-linux-arm64 (published: ${OPENCODE_ARM64_TIME:-none})" >&2
            exit 1
          fi
          DELTA_VERSION="$(latest_gh_tag dandavison/delta)"

          # Integrity hashes for the tarballs pinned in images/base/Dockerfile.
          # opencode: npm `dist.integrity` is an SRI string ("sha512-<base64>"); strip the prefix.
          OPENCODE_SHA512_X64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-x64/${OPENCODE_VERSION}" | jq -r '.dist.integrity' | sed 's/^sha512-//' | head -n1)"
          OPENCODE_SHA512_ARM64="$(curl -fsSL "https://registry.npmjs.org/@opencode/cli-linux-arm64/${OPENCODE_VERSION}" | jq -r '.dist.integrity' | sed 's/^sha512-//' | head -n1)"
          # delta: GitHub release asset `digest` is "sha256:<hex>"; strip the prefix.
          # endswith(".tar.gz") + head -n1 guard against upstream adding extra assets
          # (e.g. .sha256 sidecars) matching the same arch substring — a multi-line value
          # would silently break the sed below.
          DELTA_RELEASE="$(api "https://api.github.com/repos/dandavison/delta/releases/tags/${DELTA_VERSION}")"
          DELTA_SHA256_AMD64="$(echo "${DELTA_RELEASE}" | jq -r '.assets[] | select((.name | contains("x86_64-unknown-linux-gnu")) and (.name | endswith(".tar.gz"))) | .digest' | sed 's/^sha256://' | head -n1)"
          DELTA_SHA256_ARM64="$(echo "${DELTA_RELEASE}" | jq -r '.assets[] | select((.name | contains("aarch64-unknown-linux-gnu")) and (.name | endswith(".tar.gz"))) | .digest' | sed 's/^sha256://' | head -n1)"
          # starship needs no pinned hash: the Dockerfile fetches upstream's `.sha256`
          # sidecar at build time and verifies against it.

          for name in UV_VERSION STARSHIP_VERSION PREK_VERSION OPENCODE_VERSION OPENCODE_SHA512_X64 OPENCODE_SHA512_ARM64 DELTA_VERSION DELTA_SHA256_AMD64 DELTA_SHA256_ARM64; do
            value="${!name}"
            if [ -z "${value}" ] || [ "${value}" = "null" ]; then
              echo "Failed to resolve ${name}" >&2
              exit 1
            fi
          done

          {
            echo "uv=${UV_VERSION}"
            echo "starship=${STARSHIP_VERSION}"
            echo "prek=${PREK_VERSION}"
            echo "opencode=${OPENCODE_VERSION}"
            echo "opencode_sha512_x64=${OPENCODE_SHA512_X64}"
            echo "opencode_sha512_arm64=${OPENCODE_SHA512_ARM64}"
            echo "delta=${DELTA_VERSION}"
            echo "delta_sha256_amd64=${DELTA_SHA256_AMD64}"
            echo "delta_sha256_arm64=${DELTA_SHA256_ARM64}"
          } >> "$GITHUB_OUTPUT"

      - name: Update Dockerfile and README defaults
        env:
          UV_VERSION: ${{ steps.versions.outputs.uv }}
          STARSHIP_VERSION: ${{ steps.versions.outputs.starship }}
          PREK_VERSION: ${{ steps.versions.outputs.prek }}
          OPENCODE_VERSION: ${{ steps.versions.outputs.opencode }}
          OPENCODE_SHA512_X64: ${{ steps.versions.outputs.opencode_sha512_x64 }}
          OPENCODE_SHA512_ARM64: ${{ steps.versions.outputs.opencode_sha512_arm64 }}
          DELTA_VERSION: ${{ steps.versions.outputs.delta }}
          DELTA_SHA256_AMD64: ${{ steps.versions.outputs.delta_sha256_amd64 }}
          DELTA_SHA256_ARM64: ${{ steps.versions.outputs.delta_sha256_arm64 }}
        run: |
          set -euo pipefail

          sed -i \
            -e "s/^ARG UV_IMAGE_TAG=.*/ARG UV_IMAGE_TAG=${UV_VERSION}/" \
            -e "s/^ARG STARSHIP_VERSION=.*/ARG STARSHIP_VERSION=${STARSHIP_VERSION}/" \
            -e "s/^ARG PREK_VERSION=.*/ARG PREK_VERSION=${PREK_VERSION}/" \
            -e "s/^ARG OPENCODE_VERSION=.*/ARG OPENCODE_VERSION=${OPENCODE_VERSION}/" \
            -e "s|^ARG OPENCODE_SHA512_X64=.*|ARG OPENCODE_SHA512_X64=${OPENCODE_SHA512_X64}|" \
            -e "s|^ARG OPENCODE_SHA512_ARM64=.*|ARG OPENCODE_SHA512_ARM64=${OPENCODE_SHA512_ARM64}|" \
            -e "s/^ARG DELTA_VERSION=.*/ARG DELTA_VERSION=${DELTA_VERSION}/" \
            -e "s/^ARG DELTA_SHA256_AMD64=.*/ARG DELTA_SHA256_AMD64=${DELTA_SHA256_AMD64}/" \
            -e "s/^ARG DELTA_SHA256_ARM64=.*/ARG DELTA_SHA256_ARM64=${DELTA_SHA256_ARM64}/" \
            images/base/Dockerfile

          sed -i \
            -e "s/| \`UV_IMAGE_TAG\`[^|]*|[^|]*|/| \`UV_IMAGE_TAG\`    | \`${UV_VERSION}\` |/" \
            -e "s/| \`STARSHIP_VERSION\`[^|]*|[^|]*|/| \`STARSHIP_VERSION\`| \`${STARSHIP_VERSION}\` |/" \
            -e "s/| \`PREK_VERSION\`[^|]*|[^|]*|/| \`PREK_VERSION\`    | \`${PREK_VERSION}\`  |/" \
            -e "s/| \`OPENCODE_VERSION\`[^|]*|[^|]*|/| \`OPENCODE_VERSION\`| \`${OPENCODE_VERSION}\` |/" \
            -e "s/| \`DELTA_VERSION\`[^|]*|[^|]*|/| \`DELTA_VERSION\`   | \`${DELTA_VERSION}\` |/" \
            images/base/README.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.diff.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image with bumped versions
        if: steps.diff.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64
          load: true
          push: false
          tags: devcontainer-base-bump-test

      - name: Run smoke tests
        if: steps.diff.outputs.changed == 'true'
        run: test/images/base/test.sh devcontainer-base-bump-test

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(images): bump base image dependencies"
          title: "chore(images): bump base image dependencies"
          body: |
            Automated weekly dependency bump for `images/base`. Only releases
            published at least 7 days ago are considered (age gate).

            | Dependency | Version |
            | ---------- | ------- |
            | `uv`       | `${{ steps.versions.outputs.uv }}` |
            | `starship` | `${{ steps.versions.outputs.starship }}` |
            | `prek`     | `${{ steps.versions.outputs.prek }}` |
            | `opencode` | `${{ steps.versions.outputs.opencode }}` |
            | `delta`    | `${{ steps.versions.outputs.delta }}` |

            The bumped image was built and passed `test/images/base/test.sh` before this PR was opened.
          branch: chore/bump-base-image-deps
          delete-branch: true
