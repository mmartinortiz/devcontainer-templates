name: "Release Dev Container Templates & Generate Documentation"
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: release-templates
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Publish Templates"
        uses: devcontainers/action@1082abd5d2bf3a11abccba70eef98df068277772 # v1.4.3
        with:
          publish-templates: "true"
          base-path-to-templates: "./src"
          generate-docs: "true"
          disable-repo-tagging: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR for documentation updates
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: src/*/README.md
          commit-message: "docs: automated documentation update [skip ci]"
          title: "Automated documentation update"
          body: "Automated documentation update generated after publishing dev container templates."
          branch: automated-documentation-update
          delete-branch: true
