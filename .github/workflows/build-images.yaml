name: "Build & Publish Base Images"
on:
  pull_request:
    paths:
      - "images/**"
  push:
    branches:
      - main
    paths:
      - "images/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing (single-arch, loaded into local Docker)
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64
          load: true
          push: false
          tags: devcontainer-base-test

      - name: Run smoke tests
        run: test/images/base/test.sh devcontainer-base-test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute calendar version tag
        id: calver
        run: echo "tag=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Compute image description from Dockerfile ARG defaults
        id: description
        run: |
          set -euo pipefail
          UV=$(grep -m1 '^ARG UV_IMAGE_TAG=' images/base/Dockerfile | cut -d= -f2)
          STARSHIP=$(grep -m1 '^ARG STARSHIP_VERSION=' images/base/Dockerfile | cut -d= -f2)
          PREK=$(grep -m1 '^ARG PREK_VERSION=' images/base/Dockerfile | cut -d= -f2)
          OPENCODE=$(grep -m1 '^ARG OPENCODE_VERSION=' images/base/Dockerfile | cut -d= -f2)
          echo "text=Ubuntu dev container base image — uv/uvx ${UV}, starship ${STARSHIP}, prek ${PREK}, opencode ${OPENCODE}" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main) base image
        uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/mmartinortiz/devcontainer-images/base:latest
            ghcr.io/mmartinortiz/devcontainer-images/base:${{ steps.calver.outputs.tag }}
          annotations: ${{ github.event_name != 'pull_request' && format('index,manifest:org.opencontainers.image.description={0}', steps.description.outputs.text) || '' }}
