name: "Release Base Image"
on:
  push:
    branches:
      - main
    paths:
      - "images/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing (single-arch, loaded into local Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64
          load: true
          push: false
          tags: devcontainer-base-test

      - name: Run smoke tests
        run: test/images/base/test.sh devcontainer-base-test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute calendar version tag
        id: calver
        run: echo "tag=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Compute image description from Dockerfile ARG defaults
        id: description
        run: |
          set -euo pipefail
          UV=$(grep -m1 '^ARG UV_IMAGE_TAG=' images/base/Dockerfile | cut -d= -f2)
          STARSHIP=$(grep -m1 '^ARG STARSHIP_VERSION=' images/base/Dockerfile | cut -d= -f2)
          PREK=$(grep -m1 '^ARG PREK_VERSION=' images/base/Dockerfile | cut -d= -f2)
          OPENCODE=$(grep -m1 '^ARG OPENCODE_VERSION=' images/base/Dockerfile | cut -d= -f2)
          DELTA=$(grep -m1 '^ARG DELTA_VERSION=' images/base/Dockerfile | cut -d= -f2)
          echo "text=Ubuntu dev container base image — uv/uvx ${UV}, starship ${STARSHIP}, prek ${PREK}, opencode ${OPENCODE}, delta ${DELTA}" >> "$GITHUB_OUTPUT"

      - name: Build and push base image (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mmartinortiz/devcontainer-images/base:latest
            ghcr.io/mmartinortiz/devcontainer-images/base:${{ steps.calver.outputs.tag }}
          annotations: "index,manifest:org.opencontainers.image.description=${{ steps.description.outputs.text }}"
