name: "CI - Base Image"
on:
  pull_request:
    paths:
      - "images/**"

permissions:
  contents: read

concurrency:
  group: ci-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for testing (single-arch, loaded into local Docker)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64
          load: true
          push: false
          tags: devcontainer-base-test

      - name: Run smoke tests
        run: test/images/base/test.sh devcontainer-base-test

  build-multi-arch:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build multi-arch image (no push, catches arm64-only breakage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: false
          tags: devcontainer-base-multiarch-test
