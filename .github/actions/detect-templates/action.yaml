name: "Detect changed templates"
description: >-
  Determines which template ids (directories under src/) are affected by the
  changes in the current pull request, so downstream jobs can build a matrix
  over only the templates that changed.
outputs:
  smoke_test_templates:
    description: >-
      JSON array of template ids that should be smoke-tested, e.g.
      ["python","base"]. Includes every template when the shared test
      harness changed. "[]" when none.
    value: ${{ steps.detect.outputs.smoke_test_templates }}
  changed_templates:
    description: >-
      JSON array of template ids whose own files actually changed, e.g.
      ["python"]. This is the set that must have a bumped `version`. "[]"
      when none.
    value: ${{ steps.detect.outputs.changed_templates }}
  has_smoke_test_changes:
    description: "'true' if smoke_test_templates is non-empty, 'false' otherwise."
    value: ${{ steps.detect.outputs.has_smoke_test_changes }}
  has_changed_templates:
    description: "'true' if changed_templates is non-empty, 'false' otherwise."
    value: ${{ steps.detect.outputs.has_changed_templates }}

runs:
  using: composite
  steps:
    - name: Detect affected templates
      id: detect
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        mapfile -t lines < <("${{ github.action_path }}/detect.sh" "${BASE_REF}" "${HEAD_REF}")
        smoke_test_templates="${lines[0]}"
        changed_templates="${lines[1]}"

        echo "smoke_test_templates=${smoke_test_templates}" >> "$GITHUB_OUTPUT"
        echo "changed_templates=${changed_templates}" >> "$GITHUB_OUTPUT"

        if [ "${smoke_test_templates}" = "[]" ]; then
          echo "has_smoke_test_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_smoke_test_changes=true" >> "$GITHUB_OUTPUT"
        fi

        if [ "${changed_templates}" = "[]" ]; then
          echo "has_changed_templates=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changed_templates=true" >> "$GITHUB_OUTPUT"
        fi
