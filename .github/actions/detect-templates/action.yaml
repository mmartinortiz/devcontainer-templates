name: "Detect changed templates"
description: >-
  Determines which template ids (directories under src/) are affected by the
  changes in the current pull request, so downstream jobs can build a matrix
  over only the templates that changed.
outputs:
  templates:
    description: JSON array of affected template ids, e.g. ["python","base"]. "[]" when none.
    value: ${{ steps.detect.outputs.templates }}
  has_changes:
    description: "'true' if templates is a non-empty array, 'false' otherwise."
    value: ${{ steps.detect.outputs.has_changes }}

runs:
  using: composite
  steps:
    - name: Detect affected templates
      id: detect
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.sha }}
        HEAD_REF: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        templates="$("${{ github.action_path }}/detect.sh" "${BASE_REF}" "${HEAD_REF}")"
        echo "templates=${templates}" >> "$GITHUB_OUTPUT"
        if [ "${templates}" = "[]" ]; then
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi
